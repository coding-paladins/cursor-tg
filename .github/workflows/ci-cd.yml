---
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cursor-tg
  VERSION_MAJOR: "0"
  VERSION_MINOR: "1"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test and build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build Python package
        run: python -m build

      - name: Verify wheel installs
        run: |
          pip install --force-reinstall dist/*.whl
          python -c "import cursor_tg_connector; from cursor_tg_connector.config import Settings"
          command -v cursor-tg-connector

      - name: Upload package artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: publish-check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Pull request build; image will be tagged for validation only."
            exit 0
          fi

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Main branch push detected; publishing latest."
            exit 0
          fi

          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_SHA")"
          if git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} points to commit ${tag_commit} on main."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main; skipping publish."
          fi

      - name: Build number
        id: build_number
        if: >-
          steps.publish-check.outputs.publish == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: onyxmueller/build-tag-number@a0792399755057a06c7805cae3299807cbaf0035 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: cursor-tg

      - name: Set version
        id: version
        if: steps.publish-check.outputs.publish == 'true'
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          major="${{ env.VERSION_MAJOR }}"
          minor="${{ env.VERSION_MINOR }}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            version="${major}.${minor}.${BUILD_NUMBER}"
          else
            version="${major}.${minor}.${{ github.run_number }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${version}"

      - name: Set up Docker Buildx
        if: steps.publish-check.outputs.publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to container registry
        if: >-
          steps.publish-check.outputs.publish == 'true' &&
          github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        if: steps.publish-check.outputs.publish == 'true'
        env:
          VERSION_TAG: ${{ steps.version.outputs.version }}
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${repo}/${{ env.IMAGE_NAME }}"
          {
            echo "tags<<EOF"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "${image}:pr-${{ github.event.pull_request.number }}"
            elif [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "${image}:${VERSION_TAG}"
              echo "${image}:latest"
            else
              echo "${image}:${VERSION_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing tags for ${image}:"
          sed -n '/^tags<<EOF$/,/^EOF$/p' "$GITHUB_OUTPUT" | sed '1d;$d'

      - name: Build and push Docker image
        if: steps.publish-check.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=cursor-tg
          cache-to: type=gha,mode=max,scope=cursor-tg

      - name: Summary
        if: >-
          steps.publish-check.outputs.publish == 'true' &&
          github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${repo}/${{ env.IMAGE_NAME }}"
          echo "- \`${image}:${VERSION}\` (+ \`latest\` on main/tags)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python wheel/sdist uploaded as workflow artifacts on \`main\` pushes" >> "$GITHUB_STEP_SUMMARY"
